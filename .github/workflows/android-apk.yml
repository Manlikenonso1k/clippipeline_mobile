name: Android APK

# Builds an installable APK (no EAS needed) and publishes it as a GitHub release.
# Runs on pushes to feat/studio and on demand from the Actions tab.
on:
  push:
    branches: [feat/studio]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm install --no-audit --no-fund

      - name: Type check (advisory)
        continue-on-error: true
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production

      - name: Name the APK
        id: apk
        run: |
          VC=$(node -p "require('./app.json').expo.android.versionCode")
          VN=$(node -p "require('./app.json').expo.version")
          NAME="ClipPipeline-Studio-v${VN}-${VC}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=studio-v${VN}-${VC}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClipPipeline Studio (build ${{ steps.apk.outputs.vc }}, run ${{ github.run_number }})
          prerelease: true
          files: ${{ steps.apk.outputs.name }}
          body: |
            Android APK built from `${{ github.ref_name }}` at ${{ github.sha }}.

            **Install:** download the `.apk` below on your Android phone and open it (allow "Install unknown apps" for your browser).

            This APK is signed with a CI key, not your EAS key. If an EAS build of ClipPipeline is already installed, uninstall it first or Android will refuse the update.
