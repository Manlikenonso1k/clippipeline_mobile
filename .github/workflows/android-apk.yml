name: Android APK

# CI/CD for the app: every push is type-checked and linted; if that passes, an installable APK is
# built (no EAS needed) and published as a GitHub release.
#   push to master      -> full release, marked "Latest" (what users should download)
#   push to feat/studio -> pre-release (testing builds)
# Also runs on demand from the Actions tab.
on:
  push:
    branches: [master, feat/studio]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
    inputs:
      test_signing:
        description: 'Test the EAS-key signing path with a throwaway keystore (no release is published)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JS dependencies (pinned)
        run: |
          cp .github/ci-package-lock.json package-lock.json
          npm ci --no-audit --no-fund
      - name: Type check
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit
      - name: Lint
        run: npx expo lint

  build:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # package-lock.json is not committed (EAS uses npm install); CI pins the exact tree that was
      # tested locally so a newly published Expo patch cannot break autolinking mid-release.
      - name: Install JS dependencies (pinned)
        run: |
          cp .github/ci-package-lock.json package-lock.json
          npm ci --no-audit --no-fund

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          CI: '1'

      # Sign with the same key as EAS builds (downloaded with `eas credentials`), so CI APKs install as
      # updates over EAS installs. Until the four secrets exist, the build falls back to the debug key.
      - name: Use the EAS signing key
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.test_signing }}" = "true" ]; then
            keytool -genkeypair -v -storetype JKS -keystore /tmp/test.jks -alias test-alias -keyalg RSA -keysize 2048 -validity 1 \
              -storepass test-store-pass -keypass test-key-pass -dname "CN=CI signing test" >/dev/null 2>&1
            ANDROID_KEYSTORE_BASE64=$(base64 -w0 /tmp/test.jks)
            ANDROID_KEYSTORE_PASSWORD=test-store-pass; ANDROID_KEY_ALIAS=test-alias; ANDROID_KEY_PASSWORD=test-key-pass
            { echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"; echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"; echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"; } >> "$GITHUB_ENV"
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::warning::EAS signing secrets are not set: signing with the debug key."
            echo "key=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/eas-release.jks
          cat >> android/app/build.gradle <<'GRADLE'

          // Added by CI: sign release builds with the EAS keystore (values come from GitHub secrets).
          android {
              signingConfigs {
                  eas {
                      storeFile file('eas-release.jks')
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes.release.signingConfig = signingConfigs.eas
          }
          GRADLE
          echo "key=eas" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          NODE_ENV: production
          ANDROID_KEYSTORE_PASSWORD: ${{ inputs.test_signing && env.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ inputs.test_signing && env.ANDROID_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ inputs.test_signing && env.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}

      - name: Check the signature
        id: cert
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | tee certs.txt
          SHA=$(grep -m1 'SHA-256 digest' certs.txt | sed 's/.*: //')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.test_signing }}" = "true" ]; then
            grep -q "CN=CI signing test" certs.txt && echo "Signing test passed: the APK is signed with the provided keystore." || { echo "::error::APK is not signed with the provided keystore"; exit 1; }
          fi
          rm -f android/app/eas-release.jks

      - name: Name the APK
        id: apk
        run: |
          VC=$(node -p "require('./app.json').expo.android.versionCode")
          VN=$(node -p "require('./app.json').expo.version")
          NAME="ClipPipeline-Studio-v${VN}-${VC}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=studio-v${VN}-${VC}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.test_signing }}
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}

      - name: Release notes
        if: ${{ !inputs.test_signing }}
        run: |
          {
            cat docs/RELEASE_NOTES.md
            echo
            echo "---"
            echo "Built from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA}."
            echo
            echo "**Install:** download the \`.apk\` below on your Android phone and open it (allow \"Install unknown apps\" for your browser)."
            if [ "${{ steps.signing.outputs.key }}" = "eas" ]; then
              echo "Signed with the **EAS key** (SHA-256 \`${{ steps.cert.outputs.sha256 }}\`): installs as an update over EAS builds and earlier EAS-signed APKs."
            else
              echo "Signed with a temporary CI key (SHA-256 \`${{ steps.cert.outputs.sha256 }}\`): uninstall an EAS build of ClipPipeline first or Android will refuse the update."
            fi
          } > release-body.md

      - name: Publish GitHub release
        if: ${{ !inputs.test_signing }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ClipPipeline Studio (build ${{ steps.apk.outputs.vc }}, run ${{ github.run_number }})
          prerelease: ${{ github.ref_name != 'master' }}
          make_latest: ${{ github.ref_name == 'master' && 'true' || 'false' }}
          files: ${{ steps.apk.outputs.name }}
          body_path: release-body.md
